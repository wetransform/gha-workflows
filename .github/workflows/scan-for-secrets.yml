name: Detect secrets with Gitleaks

on:
  workflow_call:
    secrets:
      SLACK_EXPOSED_SECRETS_WEBHOOK:
        required: false

env:
  REPORT_FILE: gitleaks-report.json

jobs:
  secret-scan:
    name: Run gitleaks secret scan
    # skip Renovate branches (dependency bumps only), on PR and push events; a skipped job
    # still satisfies the required check, the default branch is scanned after merge
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'renovate/') }}
    runs-on: ubuntu-latest
    outputs:
      report-url: ${{ steps.upload-report.outputs.artifact-url }}
      slack-webhook-set: ${{ steps.check-slack.outputs.is-set }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth=0 fetches full history so gitleaks can examine all commits
          fetch-depth: 0

      # Install gitleaks via mise
      - name: Install gitleaks via mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          install: true
          install_args: "gitleaks" # only install tools needed for workflow
          cache: true
          tool_versions: |
            gitleaks 8.30.0

      # Run gitleaks against the current repository and save a JSON
      # report to gitleaks-report.json.
      - name: Run gitleaks scan
        id: gitleaks
        run: |
          set +e

          # Perform the scan on the git history
          gitleaks git \
            --report-format json \
            --report-path "${REPORT_FILE}" \
            --gitleaks-ignore-path . \
            --exit-code 1 \
            --redact \
            --verbose
          scan_exit_code=$?
          echo "exitcode=$scan_exit_code" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload report as artifact
        if: steps.gitleaks.outputs.exitcode != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-report
        with:
          name: gitleaks-report
          path: "${{ env.REPORT_FILE }}"
          retention-days: 30

      - name: Check if Slack webhook is configured
        id: check-slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_EXPOSED_SECRETS_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            echo "is-set=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-set=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if secrets were detected
        if: steps.gitleaks.outputs.exitcode != '0'
        run: |
          echo "Secrets were detected by gitleaks. Failing the workflow. See report: ${{ steps.upload-report.outputs.artifact-url }}"
          exit 1

  slack-notify:
    name: Notify on Slack if secrets were detected
    if: failure() && needs.secret-scan.outputs.slack-webhook-set == 'true'
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Download gitleaks report artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gitleaks-report

      # Build payload that lists all files + line numbers with secrets and links them
      - name: Build Slack payload
        id: build_slack
        run: |
          header="See"

          # Count findings in the report
          count=$(jq 'length' "$REPORT_FILE")

          if [ "$count" -le 10 ]; then
            leaks=""
            # Loop over each finding in the report and append file/line information
            while IFS= read -r item; do
              link=$(echo "$item" | jq -r '.Link')
              file=$(echo "$item" | jq -r '.File')
              line=$(echo "$item" | jq -r '.StartLine')
              leaks="${leaks} • [${file}:${line}](${link})\n"
            done < <(jq -c '.[]' "$REPORT_FILE")

            message="${header}\n${leaks}"
          else
            message="See report file with ${count} secrets: ${{ needs.secret-scan.outputs.report-url }}"
          fi

          # Expose the message as an environment variable for the next step
          {
            echo 'SLACK_MESSAGE<<EOF'
            echo -e "$message"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Send Slack alert
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_EXPOSED_SECRETS_WEBHOOK }}
          SLACK_COLOR: danger
          SLACK_TITLE: "Gitleaks detected secrets in ${{ github.repository }}"
          SLACK_FOOTER: ""
          SLACKIFY_MARKDOWN: true
