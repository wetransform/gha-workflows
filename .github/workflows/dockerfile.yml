on:
  workflow_call:
    inputs:
      notify-failure:
        description: Notify on build failure to Slack
        default: true
        type: boolean
      image:
        description: Image name
        required: true
        type: string
      tag:
        description: Image tag to build
        required: true
        type: string
      push:
        description: If the image should be pushed
        type: boolean
        default: false
      context:
        description: Docker build context
        type: string
        default: .
      checkout-ref:
        description: Custom ref to check out
        type: string
        default: ""
      submodules:
        # see https://github.com/actions/checkout
        default: "false"
        type: string
      branch-tag:
        description: Also tag branch builds as <branch>-<YYYYMMDD>T<HHmmss>-<sha>
        type: boolean
        default: true
    secrets:
      DOCKER_HUB_USERNAME:
      DOCKER_HUB_PASSWORD:
      GH_PAT:
      SLACK_NOTIFICATIONS_BOT_TOKEN:

jobs:
  run:
    runs-on: ${{ vars.CUSTOM_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          submodules: ${{ inputs.submodules }}
          # so no checkout credential (PAT or GITHUB_TOKEN) ends up in
          # .git/config inside the Docker build context
          persist-credentials: false
          # provide a token in case submodules are enabled and private (secret is expected to be present)
          token: ${{ inputs.submodules != 'false' && secrets.GH_PAT || github.token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}

      # Traceable tag for branch builds: <branch>-<commit date>T<commit time, UTC>-<short sha>
      # Skipped for tag/PR refs ({{branch}} is empty there), for a custom checkout-ref
      # (not necessarily the branch the workflow runs for) and for too long branch names
      # Details for the <branch>-<date>T<time>-<sha> tag, taken from the checked out commit
      # (committer date in UTC; the workflow context may provide the author date instead)
      - name: Determine branch tag details
        id: branch_tag_info
        if: ${{ inputs.branch-tag && startsWith(github.ref, 'refs/heads/') && inputs.checkout-ref == '' }}
        run: |
          timestamp=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%dT%H%M%S HEAD) || timestamp=""
          sha=$(git rev-parse HEAD) || sha=""
          sha=${sha:0:7}
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ ! "$timestamp" =~ ^[0-9]{8}T[0-9]{6}$ || ! "$sha" =~ ^[0-9a-f]{7}$ ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not determine commit details via git, skipping <branch>-<date>T<time>-<sha> image tag"
          # Docker tags are limited to 128 characters, the tag adds 24 characters to the branch name
          elif [ "${#GITHUB_REF_NAME}" -le 104 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Branch name too long, skipping <branch>-<date>T<time>-<sha> image tag"
          fi

      - name: Docker branch tag
        id: branch_tag
        if: steps.branch_tag_info.outputs.enabled == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value={{branch}}-${{ steps.branch_tag_info.outputs.timestamp }}-${{ steps.branch_tag_info.outputs.sha }}

      - name: Login to DockerHub
        if: env.DOCKER_HUB_USERNAME
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}

      # Docker Hardened Images share the same Docker Hub credentials
      - name: Login to Docker Hardened Images
        if: env.DOCKER_HUB_USERNAME
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          push: ${{ inputs.push }}
          tags: |
            ${{ inputs.image }}:${{ inputs.tag }}
            ${{ steps.branch_tag.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Vulnerability check
        uses: wetransform/gha-trivy@de7803d3d2135ab8ec9093b50a76db298df095be # v3.0.1
        with:
          image-ref: "${{ inputs.image }}:${{ inputs.tag }}"
          create-test-report: true
          report-retention-days: 30
          report-tag: "${{ inputs.image }}:${{ inputs.tag }}"

      #
      # Report build failure to Slack
      #

      # https://github.com/marketplace/actions/slack-notify-build
      - name: Notify slack fail
        if: ${{ inputs.notify-failure && failure() }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}
        uses: voxmedia/github-action-slack-notify-build@3665186a8c1a022b28a1dbe0954e73aa9081ea9e # v1.6.0
        with:
          channel: build-failures
          status: FAILED
          color: danger
